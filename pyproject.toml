[project]
name = "notion-py"
version = "0.5.1"
description = "Cookie-based Notion client: core lib + CLI + MCP server"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/npy-core", "packages/npy-cli", "packages/npy-mcp"]

[tool.uv.sources]
npy-core = { workspace = true }
npy-cli = { workspace = true }
npy-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "vcrpy>=6",
]