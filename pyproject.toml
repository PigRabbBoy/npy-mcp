[project]
name = "unpy"
version = "1.0.0"
description = "Cookie-based Notion client: core lib + CLI + MCP server"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/unpy-core", "packages/unpy-cli", "packages/unpy-mcp"]

[tool.uv.sources]
unpy-core = { workspace = true }
unpy-cli = { workspace = true }
unpy-mcp = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "vcrpy>=6",
]