[project]
name = "unpy-core"
version = "1.1.2"
description = "Cookie-based Notion internal API client (core library)"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "commonmark>=0.9",
    "bs4",
    "tzlocal",
    "python-slugify>=8",
    "dictdiffer>=0.10",
    "cached-property>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unpy"]