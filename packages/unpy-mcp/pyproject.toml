[project]
name = "unpy-mcp"
version = "1.0.1"
description = "MCP server for Notion (stdio + HTTP, cookie-based)"
requires-python = ">=3.12"
dependencies = [
    "unpy-core",
    "mcp>=1.0",
]

[project.scripts]
unpy-mcp = "unpy_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unpy_mcp"]