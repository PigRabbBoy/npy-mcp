[project]
name = "npy-cli"
version = "0.7.3"
description = "CLI for Notion (cookie-based, powered by npy-core)"
requires-python = ">=3.12"
dependencies = [
    "npy-core",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
notion = "notion_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_cli"]