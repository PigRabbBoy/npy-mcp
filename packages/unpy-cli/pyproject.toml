[project]
name = "unpy-cli"
version = "1.0.1"
description = "CLI for Notion (cookie-based, powered by unpy-core)"
requires-python = ">=3.12"
dependencies = [
    "unpy-core",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
unpy = "unpy_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unpy_cli"]