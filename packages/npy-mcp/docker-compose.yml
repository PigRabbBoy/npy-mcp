# Docker Compose for npy-mcp — Notion MCP server over HTTP
#
# Usage:
#   docker compose up -d
#   # Server runs on http://localhost:8000/mcp
#
# Required env vars (set in .env or export before running):
#   NOTION_TOKEN_V2     — your Notion session token (from browser DevTools)
#   NOTION_MCP_AUTH_TOKEN — Bearer token clients must send (protects remote access)
#
# Optional:
#   NOTION_ALLOW_WRITE=1  — enable write tools (create/update/delete)
#   NOTION_SPACE_ID       — bind to a specific space

services:
  notion-mcp:
    build:
      context: ../..
      dockerfile: packages/npy-mcp/Dockerfile
    image: notion-mcp:latest
    ports:
      - "8000:8000"
    environment:
      - NOTION_TOKEN_V2=${NOTION_TOKEN_V2:?NOTION_TOKEN_V2 is required}
      - NOTION_MCP_AUTH_TOKEN=${NOTION_MCP_AUTH_TOKEN:?NOTION_MCP_AUTH_TOKEN is required}
      - NOTION_ALLOW_WRITE=${NOTION_ALLOW_WRITE:-0}
      - NOTION_SPACE_ID=${NOTION_SPACE_ID:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/mcp', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s