[project]
name = "npy-mcp"
version = "0.7.0"
description = "MCP server for Notion (stdio + HTTP, cookie-based)"
requires-python = ">=3.12"
dependencies = [
    "npy-core",
    "mcp>=1.0",
]

[project.scripts]
notion-mcp = "notion_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notion_mcp"]